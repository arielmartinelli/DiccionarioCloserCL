<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valores y Pagos 💳 — Diccionario del Closer</title>
  
  <!-- Estilos y Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Ruta CSS ajustada -->
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../../index.html">
        <img src="../../assets/img/logo.png" class="logo-sm me-2" alt="Logo" onerror="this.style.display='none'">
        <span class="fw-bold text-dark">Closer Dictionary</span>
      </a>
      <!-- Indicador de estado -->
      <span id="apiStatus" class="badge bg-secondary cursor-pointer" onclick="fetchRates(true)" title="Clic para reintentar">Conectando...</span>
    </div>
  </nav>

  <header class="py-5 text-center bg-main">
    <div class="container">
      <h1 class="fw-bold">Calculadora de Pagos 💳</h1>
      <p class="lead mb-0 text-white-50">Cotización dLocal Go</p>
      <!-- Alerta de Error (Oculta por defecto) -->
      <div id="errorAlert" class="alert alert-danger mt-3 d-none mx-auto w-50 small"></div>
    </div>
  </header>

  <main class="container py-5">
    
    <!-- CALCULADORA -->
    <div class="row mb-5">
      <div class="col-12">
        <div class="card shadow calculator-section p-4">
          <div class="row g-4">
            
            <!-- PANEL IZQUIERDO -->
            <div class="col-lg-4 border-end-lg">
              <h4 class="fw-bold mb-4 text-primary"><i class="bi bi-sliders"></i> Configuración</h4>
              
              <div class="mb-3">
                <label class="form-label fw-bold small text-muted">País</label>
                <select id="countrySelect" class="form-select" onchange="updateUI()">
                  <option value="AR">🇦🇷 Argentina</option>
                  <option value="MX">🇲🇽 México</option>
                  <option value="CO">🇨🇴 Colombia</option>
                  <option value="CL">🇨🇱 Chile</option>
                  <option value="PE">🇵🇪 Perú</option>
                  <option value="CR">🇨🇷 Costa Rica</option>
                  <option value="UY">🇺🇾 Uruguay</option>
                  <option value="VE">🇻🇪 Venezuela</option>
                  <option value="US">🇺🇸 Estados Unidos</option>
                  <option value="ES">🇪🇺 Europa</option>
                </select>
                <div id="taxIdContainer" class="mt-2"></div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold small text-muted d-flex justify-content-between">
                  <span>Cambio (1 USD =)</span>
                  <a href="#" class="text-decoration-none small" onclick="fetchRates(true)">Refrescar</a>
                </label>
                <div class="input-group">
                  <span class="input-group-text" id="currencySymbol">$</span>
                  <input type="number" id="exchangeRate" class="form-control" step="0.01" oninput="calculate()">
                </div>
                <small class="text-muted text-xs d-block mt-1 fst-italic" id="rateSourceLabel">...</small>
              </div>

              <hr>

              <!-- Opciones -->
              <div class="mb-3">
                <div class="btn-group w-100 mb-3">
                  <input type="radio" class="btn-check" name="programType" id="typeTraditional" value="traditional" checked onchange="calculate()">
                  <label class="btn btn-outline-primary" for="typeTraditional">Tradicional</label>
                  <input type="radio" class="btn-check" name="programType" id="typeIntensive" value="intensive" onchange="calculate()">
                  <label class="btn btn-outline-dark" for="typeIntensive">Intensive</label>
                </div>
                
                <div class="form-check form-switch p-2 bg-light border rounded">
                  <input class="form-check-input ms-0 me-2" type="checkbox" id="scholarshipSwitch" checked onchange="calculate()">
                  <label class="form-check-label fw-bold" for="scholarshipSwitch">Aplicar BECA</label>
                </div>
              </div>

              <!-- Modos de Pago -->
               <div class="d-grid gap-2 mb-3">
                  <input type="radio" class="btn-check" name="calcMode" id="modeSimple" value="simple" checked onchange="toggleMode()">
                  <label class="btn btn-outline-success btn-sm" for="modeSimple">⚡ Tabla Fija</label>

                  <input type="radio" class="btn-check" name="calcMode" id="modeCustom" value="custom" onchange="toggleMode()">
                  <label class="btn btn-outline-warning btn-sm" for="modeCustom">🛠️ Armar Plan</label>
                </div>

              <div id="initialPaymentBlock" class="animate__animated animate__fadeIn" style="display: none;">
                <label class="form-label fw-bold text-success small">💰 Pago Inicial (EUR)</label>
                <input type="number" id="initialPayment" class="form-control border-success" value="0" oninput="calculate()">
              </div>
            </div>

            <!-- PANEL DERECHO -->
            <div class="col-lg-8 ps-lg-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold m-0">Plan de Inversión</h4>
                <span id="regionBadge" class="badge bg-secondary">LATAM</span>
              </div>

              <div class="text-center bg-light rounded-3 p-4 mb-4 border border-dashed position-relative">
                <span id="intensiveBadge" class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-dark d-none">INTENSIVE</span>
                <div class="row">
                  <div class="col-6 border-end">
                    <small class="text-muted fw-bold">CONTADO (EUR)</small>
                    <div id="totalPriceEur" class="fs-2 fw-bold text-dark">1000 €</div>
                  </div>
                  <div class="col-6">
                    <small class="text-muted fw-bold">CONTADO (USD)</small>
                    <div id="totalPriceUsd" class="fs-2 fw-bold text-primary">≈ $1,175</div>
                  </div>
                </div>
                <div class="mt-2 fw-bold text-success" id="localPriceDisplay"></div>
              </div>

              <div id="intensiveAlert" class="alert alert-warning d-none py-2 small">
                <i class="bi bi-exclamation-circle-fill"></i> Mínimo inicial: <strong>1000€</strong>.
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle caption-top">
                  <caption id="tableCaption">Tabla de Financiación</caption>
                  <thead class="table-light">
                    <tr><th>Plan</th><th class="text-end">Cuota (USD)</th><th class="text-end">Local (<span id="tableCurrency"></span>)</th></tr>
                  </thead>
                  <tbody id="installmentTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <div class="back-container"><a class="back" href="../../index.html"></a></div>
  <footer class="py-4 text-center text-muted small"><div class="container">© 2025 Conquer Languages</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const EUR_TO_USD = 1.175;
    const INTEREST_RATES = { 3: 0.056, 6: 0.134, 9: 0.215, 12: 0.296 };
    const FIXED_QUOTES = {
      "LATAM": { 12: 127, 9: 159, 6: 222, 3: 405 },
      "USA":   { 12: 235, 9: 300, 6: 427, 3: 811 },
      "EU":    { 12: 200, 9: 256, 6: 368, 3: 700 }
    };
    const prices = {
      "LATAM": { "traditional": { full: 1500, scholarship: 1000 }, "intensive": { full: 2500, scholarship: 2000 } },
      "USA":   { "traditional": { full: 2500, scholarship: 2000 }, "intensive": { full: 4000, scholarship: 3500 } },
      "EU":    { "traditional": { full: 2500, scholarship: 2000 }, "intensive": { full: 4000, scholarship: 3500 } }
    };

    // Fallback data
    const countries = {
      "AR": { name: "Argentina", region: "LATAM", currency: "ARS", symbol: "$", rate: 1320, taxId: "DNI / CUIL" },
      "MX": { name: "México", region: "LATAM", currency: "MXN", symbol: "$", rate: 21.85, taxId: "CURP / IFE" },
      "CO": { name: "Colombia", region: "LATAM", currency: "COP", symbol: "$", rate: 4689, taxId: "Cédula" },
      "CL": { name: "Chile", region: "LATAM", currency: "CLP", symbol: "$", rate: 1083, taxId: "RUT" },
      "PE": { name: "Perú", region: "LATAM", currency: "PEN", symbol: "S/", rate: 3.96, taxId: "DNI" },
      "CR": { name: "Costa Rica", region: "LATAM", currency: "CRC", symbol: "₡", rate: 536, taxId: "Cédula" },
      "UY": { name: "Uruguay", region: "LATAM", currency: "UYU", symbol: "$U", rate: 47, taxId: "Cédula" },
      "VE": { name: "Venezuela", region: "LATAM", currency: "VES", symbol: "Bs", rate: 55.0, taxId: "Cédula / RIF" },
      "US": { name: "USA", region: "USA", currency: "USD", symbol: "$", rate: 1, taxId: "ID / SSN" },
      "ES": { name: "Europa", region: "EU", currency: "EUR", symbol: "€", rate: 1, taxId: "DNI / NIE" }
    };

    document.addEventListener('DOMContentLoaded', () => { fetchRates(); toggleMode(); });

    async function fetchRates(manual = false) {
      const status = document.getElementById('apiStatus');
      const errorAlert = document.getElementById('errorAlert');
      const label = document.getElementById('rateSourceLabel');

      if (manual) status.innerText = "Conectando...";
      errorAlert.classList.add('d-none'); // Ocultar error previo

      try {
        const res = await fetch('/api/dlocal-rates');
        
        // --- DIAGNÓSTICO DE ERRORES ---
        if (res.status === 404) throw new Error("Error 404: No encuentro el archivo api/dlocal-rates.js. Revisa que la carpeta 'api' esté en la raíz.");
        if (res.status === 500) throw new Error("Error 500: Fallo en el servidor. Revisa las API Keys en Vercel.");
        if (!res.ok) throw new Error(`Error ${res.status}: Problema de conexión.`);

        const data = await res.json();
        
        // Verificar si la respuesta contiene un error de dLocal
        if (data.error) throw new Error(data.error);

        // Éxito
        Object.keys(data).forEach(k => { if(countries[k]) countries[k].rate = data[k]; });
        
        status.innerText = "Online 🟢";
        status.className = "badge bg-success";
        label.innerText = "Tasa Oficial dLocal Go";
        updateUI();

      } catch (err) {
        console.warn(err);
        status.innerText = "Offline 🟠";
        status.className = "badge bg-warning text-dark";
        label.innerText = "Usando tasa guardada (Offline)";
        
        // Mostrar error detallado en pantalla para que sepas qué pasa
        errorAlert.innerText = `Diagnóstico: ${err.message}`;
        errorAlert.classList.remove('d-none');
        
        updateUI();
      }
    }

    // --- FUNCIONES DE CÁLCULO (Sin cambios) ---
    function updateUI() {
      const c = document.getElementById('countrySelect').value;
      document.getElementById('exchangeRate').value = countries[c].rate;
      calculate();
    }
    
    function toggleMode() {
      const isCustom = document.getElementById('modeCustom').checked;
      document.getElementById('initialPaymentBlock').style.display = isCustom ? 'block' : 'none';
      document.getElementById('tableCaption').innerText = isCustom ? "Plan Personalizado" : "Cuotas Fijas";
      if (!isCustom) document.getElementById('initialPayment').value = 0;
      calculate();
    }

    function calculate() {
      const countryCode = document.getElementById('countrySelect').value;
      const data = countries[countryCode];
      const program = document.querySelector('input[name="programType"]:checked').value;
      const hasScholarship = document.getElementById('scholarshipSwitch').checked;
      const mode = document.querySelector('input[name="calcMode"]:checked').value;
      
      let rate = parseFloat(document.getElementById('exchangeRate').value) || data.rate;
      
      // UI Update
      document.getElementById('currencySymbol').innerText = data.symbol;
      document.getElementById('regionBadge').innerText = data.region;
      document.getElementById('tableCurrency').innerText = data.currency;
      document.getElementById('taxIdContainer').innerHTML = `<span class="badge bg-light text-primary border"><i class="bi bi-card-heading"></i> ${data.taxId}</span>`;

      // Intensive UI
      const isIntensive = program === 'intensive';
      document.getElementById('intensiveBadge').classList.toggle('d-none', !isIntensive);
      document.getElementById('intensiveAlert').classList.toggle('d-none', !isIntensive);
      if (isIntensive && mode === 'custom' && parseFloat(document.getElementById('initialPayment').value) === 0) {
        document.getElementById('initialPayment').value = 1000;
      }

      // Precios
      const baseEur = prices[data.region][program][hasScholarship ? 'scholarship' : 'full'];
      const baseUsd = baseEur * EUR_TO_USD;
      document.getElementById('totalPriceEur').innerText = fmt(baseEur, 'EUR');
      document.getElementById('totalPriceUsd').innerText = '≈ ' + fmt(baseUsd, 'USD');
      
      let localVal = (countryCode === 'ES') ? baseEur : (baseUsd * rate);
      document.getElementById('localPriceDisplay').innerText = `Local: ${fmt(localVal, data.currency)}`;

      // Tabla
      const tbody = document.getElementById('installmentTable');
      tbody.innerHTML = '';
      
      if (mode === 'simple') {
        if (isIntensive || !hasScholarship) {
          tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger small">Para este plan, usa el modo "Armar Plan".</td></tr>`;
          return;
        }
        const fixed = FIXED_QUOTES[data.region];
        [12, 9, 6, 3].forEach(m => {
           let valBase = fixed[m];
           let valLoc = (countryCode === 'ES' || countryCode === 'US') ? valBase : (valBase * rate);
           tbody.innerHTML += `<tr><td>${m} cuotas</td><td class="text-end fw-bold">${countryCode === 'ES' ? '€' : '$'} ${valBase}</td><td class="text-end text-muted">${fmt(valLoc, data.currency)}</td></tr>`;
        });
      } else {
        let init = parseFloat(document.getElementById('initialPayment').value) || 0;
        let remnant = Math.max(0, baseEur - init);
        tbody.innerHTML += `<tr class="table-warning"><td colspan="3" class="small text-center fw-bold">A financiar: ${fmt(remnant, 'EUR')}</td></tr>`;
        
        [12, 9, 6, 3].forEach(m => {
           let baseM = 0;
           if (countryCode === 'ES') {
             baseM = (remnant * (1 + INTEREST_RATES[m])) / m;
           } else {
             let remUsd = remnant * EUR_TO_USD;
             baseM = (remUsd * (1 + INTEREST_RATES[m])) / m;
           }
           let locM = (countryCode === 'ES' || countryCode === 'US') ? baseM : (baseM * rate);
           let sym = countryCode === 'ES' ? '€' : '$';
           tbody.innerHTML += `<tr><td>${m} x</td><td class="text-end fw-bold">${sym} ${baseM.toFixed(0)}</td><td class="text-end text-muted">${fmt(locM, data.currency)}</td></tr>`;
        });
      }
    }
    
    function fmt(n, c) { 
      return new Intl.NumberFormat('es-ES', { style: 'currency', currency: c, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n); 
    }
  </script>
</body>
</html>
